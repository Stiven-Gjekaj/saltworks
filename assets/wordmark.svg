<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 180" width="756" height="180" role="img" aria-label="Saltworks">
  <title>Saltworks</title>

  <defs>
    <!-- Moonlight through to the first light of dawn. The shift runs along the
         word, from the night theme to the day theme. -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#9fb4ec"/>
      <stop offset="0.45" stop-color="#b9a6e6"/>
      <stop offset="0.8" stop-color="#e9a8b8"/>
      <stop offset="1" stop-color="#f3b48a"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- One dither cell, tiled: the 2x2 pattern of the themes, at half strength. -->
    <pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#2b3354" opacity="0.55"/>
      <rect x="4" y="4" width="4" height="4" fill="#2b3354" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="756" height="180" rx="16" fill="#10121c"/>
  <rect x="0" y="136" width="756" height="44" fill="url(#dither)" opacity="0.6"/>
  <rect x="6" y="6" width="744" height="168" rx="11"
        fill="none" stroke="#7fb0dc" stroke-opacity="0.28" stroke-width="2"/>

